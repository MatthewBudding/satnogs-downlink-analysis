[project]
name = "satlink"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MatthewBudding", email = "matt33b33@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-storage>=3.16.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
]

[project.scripts]
satlink = "satlink:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
